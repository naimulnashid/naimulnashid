<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="Internet Speed Meter">
  <title>Internet Speed Meter</title>

  <!--
    Vector twin of assets/app.ico, on the same 32 unit grid the icon is drawn on
    (see tools/make-icon.ps1): identical corner radius, gradient and arrow geometry,
    so the two stay in step if either is edited.
  -->

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262834"/>
      <stop offset="1" stop-color="#16171E"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" ry="7" fill="url(#tile)"/>

  <!-- Download: green, pointing down -->
  <path fill="#6EE7A8" d="M6.5 7 H13.5 V17 H17 L10 25 L3 17 H6.5 Z"/>

  <!-- Upload: amber, pointing up -->
  <path fill="#FFC46B" d="M18.5 25 H25.5 V15 H29 L22 7 L15 15 H18.5 Z"/>
</svg>
