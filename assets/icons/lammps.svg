<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="LAMMPS Molecular Dynamics Tutorials">
  <title>LAMMPS Molecular Dynamics Tutorials</title>
  <defs><linearGradient id="tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#262834"/><stop offset="1" stop-color="#16171E"/></linearGradient></defs>
  <rect width="32" height="32" rx="7" ry="7" fill="url(#tile)"/>
  <!-- A small crystal cell: four atoms on a square with a fifth in the middle, bonded -->
  <g stroke="#7FA6C9" stroke-width="1.6">
    <line x1="9" y1="9" x2="23" y2="9"/>
    <line x1="23" y1="9" x2="23" y2="23"/>
    <line x1="23" y1="23" x2="9" y2="23"/>
    <line x1="9" y1="23" x2="9" y2="9"/>
    <line x1="9" y1="9" x2="23" y2="23"/>
    <line x1="23" y1="9" x2="9" y2="23"/>
  </g>
  <circle cx="9" cy="9" r="3.4" fill="#4FC3F7"/>
  <circle cx="23" cy="9" r="3.4" fill="#4FC3F7"/>
  <circle cx="9" cy="23" r="3.4" fill="#4FC3F7"/>
  <circle cx="23" cy="23" r="3.4" fill="#4FC3F7"/>
  <circle cx="16" cy="16" r="4" fill="#FFC46B"/>
</svg>
