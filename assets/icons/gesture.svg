<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Hand-Gesture Volume Control">
  <title>Hand-Gesture Volume Control</title>
  <defs><linearGradient id="tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#262834"/><stop offset="1" stop-color="#16171E"/></linearGradient></defs>
  <rect width="32" height="32" rx="7" ry="7" fill="url(#tile)"/>
  <!-- Thumb and index tips joined by the pinch line -->
  <line x1="9" y1="23" x2="23" y2="9" stroke="#C792EA" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="9" cy="23" r="4" fill="#C792EA"/>
  <circle cx="23" cy="9" r="4" fill="#C792EA"/>
  <circle cx="16" cy="16" r="2.6" fill="#FFFFFF"/>
</svg>
